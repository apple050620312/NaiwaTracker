<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11151c" />
    <title>奶蛙在哪裡</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="奶蛙導覽">
        <div class="brand-lockup">
          <div class="brand-orbit" aria-hidden="true"><span>🐸</span></div>
          <div>
            <p class="eyebrow">NAIWA TRACKER</p>
            <h1 id="brandTitle">奶蛙在哪裡</h1>
          </div>
        </div>

        <div class="sidebar-intro">
          <span class="status-dot status-dot--live" id="sourceDot"></span>
          <div>
            <strong id="sourceLabel">正在載入</strong>
            <p id="sourceHint">準備查看奶蛙的足跡</p>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="section-heading">
            <span>我的奶蛙</span>
          </div>
          <div class="device-list" id="deviceList" aria-live="polite"></div>
        </div>

        <div class="sidebar-footer">
          <span class="public-note">只看奶蛙足跡</span>
          <a class="admin-link" href="/admin.html">管理員診斷</a>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="todayLabel">TODAY · NAIWA</p>
            <p class="topbar-copy" id="tagline">今天的奶蛙，也在努力探索世界。</p>
          </div>
          <div class="topbar-actions">
            <span class="sync-label" id="syncLabel">尚未同步</span>
            <button class="icon-button" id="refreshButton" type="button" aria-label="重新整理" title="重新整理">
              <span aria-hidden="true">↻</span>
            </button>
          </div>
        </header>

        <section class="hero-row">
          <div>
            <p class="eyebrow eyebrow--accent">LIVE LOCATION</p>
            <h2 id="heroTitle">奶蛙現在在哪裡？</h2>
          </div>
          <button class="primary-button" id="locateButton" type="button">
            <span class="button-icon" aria-hidden="true">⌁</span>
            <span>現在定位</span>
          </button>
        </section>

        <section class="map-card" aria-label="奶蛙的位置地圖">
          <div class="map-toolbar">
            <div class="selected-device">
              <div class="mini-avatar" id="miniAvatar" aria-hidden="true">🐸</div>
              <div>
                <strong id="selectedName">奶蛙</strong>
                <span id="selectedModel">奶蛙的足跡</span>
              </div>
            </div>
            <div class="map-status" id="mapStatus"><span class="status-dot status-dot--live"></span> 定位已更新</div>
          </div>
          <div class="map-stage" id="mapStage">
            <iframe id="mapFrame" class="map-frame" title="奶蛙最新位置地圖" loading="lazy" hidden></iframe>
            <div class="history-markers" id="historyMarkers" aria-label="過去足跡"></div>
            <div class="map-noise"></div>
            <div class="map-road map-road--one"></div>
            <div class="map-road map-road--two"></div>
            <div class="map-road map-road--three"></div>
            <div class="map-water"></div>
            <div class="map-neighborhood neighborhood--one">信義</div>
            <div class="map-neighborhood neighborhood--two">大安</div>
            <div class="map-neighborhood neighborhood--three">松山</div>
            <div class="map-scale"><span></span><small>500 m</small></div>
            <div class="map-marker" id="mapMarker" aria-label="奶蛙位置">
              <div class="marker-pulse"></div>
              <div class="marker-pin"><span id="markerAvatar">🐸</span></div>
              <div class="marker-label"><strong id="markerLabel">奶蛙秘密基地</strong><span id="markerTime">剛剛</span></div>
            </div>
            <div class="map-empty" id="mapEmpty" hidden>
              <span>⌖</span>
              <strong>還沒有位置資料</strong>
              <small>按下「現在定位」，請奶蛙回報一下。</small>
            </div>
          </div>
          <div class="map-footer">
            <div class="location-copy">
              <span class="location-pin" aria-hidden="true">⌖</span>
              <div>
                <strong id="locationLabel">台北信義區 · 奶蛙秘密基地</strong>
                <span id="coordinates">位置已保護 · 地圖已更新</span>
              </div>
            </div>
            <a class="map-link" id="mapsLink" href="#" target="_blank" rel="noreferrer">在 Google Maps 開啟 <span aria-hidden="true">↗</span></a>
          </div>
        </section>

        <section class="stats-grid" aria-label="位置資訊摘要">
          <article class="stat-card">
            <div class="stat-icon stat-icon--lime">◌</div>
            <div><span>最後回報</span><strong id="lastSeen">8 分鐘前</strong></div>
            <span class="stat-decoration">✦</span>
          </article>
          <article class="stat-card">
            <div class="stat-icon stat-icon--violet">⌖</div>
            <div><span>位置精準度</span><strong id="accuracy">約 32 公尺</strong></div>
            <span class="stat-decoration">+</span>
          </article>
          <article class="stat-card">
            <div class="stat-icon stat-icon--coral">♡</div>
            <div><span>追蹤狀態</span><strong id="trackerStatus">正在附近</strong></div>
            <span class="stat-decoration">✦</span>
          </article>
        </section>

      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
